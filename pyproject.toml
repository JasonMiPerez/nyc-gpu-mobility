[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-gpu-mobility"
version = "0.1.0"
description = "Reproducible NYC taxi analytics, CPU/GPU experiments, and a public-ready dashboard"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "pyarrow>=18,<27",
  "scikit-learn>=1.5,<2", "dash>=3,<5", "plotly>=6,<8",
  "pydantic>=2,<3", "PyYAML>=6,<7", "requests>=2.32,<3",
  "geopandas>=1,<2", "psutil>=6,<8", "gunicorn>=23,<27",
  "networkx>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
mobility = "mobility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mobility.dashboard" = ["assets/*", "static/*"]
"mobility.backends" = ["kernels/*.cu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a compatible NVIDIA GPU and GPU environment"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

