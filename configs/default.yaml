schema_version: 1
time_policy: nyc_local_wall_time_v1
data:
  dataset: yellow
  year: 2024
  months: [1, 2, 3, 4, 5, 6]
processing:
  execution_mode: native
  backend: cpu
  batch_rows: 250000
  gpu_memory_fraction: 0.65
  allow_missing_sources: false
splits:
  train_start: 2024-01-01
  train_end: 2024-04-01
  calibration_start: 2024-04-01
  calibration_end: 2024-05-01
  test_start: 2024-05-01
  test_end: 2024-07-01
clustering:
  k_values: [4, 6, 8]
  training_max_rows: 200000
  evaluation_max_rows: 2000
  # Model-only study limits; raw data and pickup/drop-off counts are preserved.
  max_distance_miles: 100
  max_duration_minutes: 180
  max_mean_speed_mph: 100
  seed: 42
anomalies:
  min_history: 8
  scale_floor: 5.0
  score_threshold: 4.0
  absolute_threshold: 20
duration_anomalies:
  enabled: true
  min_history: 8
  min_trips_per_hour: 20
  scale_floor_minutes: 2
  absolute_threshold_minutes: 5
  score_threshold: 4
graph:
  enabled: true
  min_trips_per_edge: 1
  pagerank_alpha: 0.85
  louvain_resolution: 1
  seed: 42
benchmark:
  warmups: 2
  repeats: 7
  max_rows: 1000000
  cpu_threads: 4
  seed: 42
dashboard:
  max_flows: 200
  max_points: 5000
  max_export_rows: 50000
