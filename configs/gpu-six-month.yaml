# Run in the isolated Linux GPU environment described in docs/gpu.md.
data:
  dataset: yellow
  year: 2024
  months: [1, 2, 3, 4, 5, 6]
processing:
  execution_mode: native
  backend: gpu
  batch_rows: 250000
  gpu_memory_fraction: 0.65
  custom_cuda: true
  verify_gpu_batches: false
duration_anomalies:
  enabled: true
graph:
  enabled: true
